name: Generate SEO pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/generate_seo_pages.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate city, service and article pages
        run: python tools/generate_seo_pages.py

      - name: Apply sitemap exclusion index controls
        run: |
          python scripts/apply_sitemap_exclusion_noindex.py
          python scripts/validate_sitemap_exclusions.py
          python scripts/seo_quality_audit.py --root . --report seo-audit-report.md --strict

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Generate local SEO pages and update sitemap [skip ci]"
            git push
          fi
