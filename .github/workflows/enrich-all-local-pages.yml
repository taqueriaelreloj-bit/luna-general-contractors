name: Enrich All Local SEO Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/enrich_all_local_pages.py"
      - "scripts/enrich_local_faqs.py"
      - "scripts/update_sitemap_lastmod.py"
      - ".github/workflows/enrich-all-local-pages.yml"
  schedule:
    - cron: "45 12 * * *"

permissions:
  contents: write

concurrency:
  group: enrich-all-local-seo-pages
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add unique mini-blog to every local city and service page
        run: python scripts/enrich_all_local_pages.py

      - name: Add unique FAQs to every local city and service page
        run: python scripts/enrich_local_faqs.py

      - name: Update sitemap dates only for changed pages
        run: python scripts/update_sitemap_lastmod.py

      - name: Validate local SEO enrichment coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          blog_marker = 'seo-section seo-mini-blog'
          faq_marker = 'seo-section seo-faq'
          manifest = [
              line.strip()
              for line in Path('seo-generated-manifest.txt').read_text(encoding='utf-8').splitlines()
              if line.strip().endswith('.html')
          ]

          excluded = {
              'articles.html', 'service-areas.html', 'services-by-city.html',
              'bathroom-remodeling-cost-waxahachie.html',
              'best-general-contractor-midlothian.html',
              'commercial-construction-planning-dallas.html',
              'drywall-repair-after-water-damage-grand-prairie.html',
              'fence-replacement-cost-cedar-hill.html',
              'flooring-options-mansfield.html',
              'kitchen-remodeling-ideas-texas.html',
              'roof-replacement-cost-dallas.html',
              'roofing-insurance-claim-fort-worth.html',
              'water-damage-insurance-claims-arlington.html',
          }

          local_pages = []
          for filename in manifest:
              if filename in excluded:
                  continue
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if faq_marker in text or blog_marker in text:
                  local_pages.append(filename)

          missing_blog = []
          duplicate_blog = []
          missing_faq = []
          duplicate_faq = []
          missing_schema = []
          bad_copy = []
          faq_fingerprints = {}

          for filename in local_pages:
              text = Path(filename).read_text(encoding='utf-8')
              blog_count = text.count(blog_marker)
              faq_count = text.count(faq_marker)
              schema_count = text.count('"@type":"FAQPage"')

              if blog_count == 0:
                  missing_blog.append(filename)
              elif blog_count > 1:
                  duplicate_blog.append(filename)

              if faq_count == 0:
                  missing_faq.append(filename)
              elif faq_count > 1:
                  duplicate_faq.append(filename)

              if schema_count != 1:
                  missing_schema.append(filename)

              visible = re.sub(r'<[^>]+>', ' ', text)
              if re.search(r'\bin\s+Serving\s+[A-Z]', visible, re.I):
                  bad_copy.append(filename)
              if re.search(r'\b(?:a|A)\s+(?:Allen|Arlington|Euless|Irving|Ovilla)\b', visible):
                  bad_copy.append(filename)

              match = re.search(r'<section class="seo-section seo-faq">(.*?)</section>', text, re.S)
              if match:
                  fingerprint = match.group(1).strip()
                  if fingerprint in faq_fingerprints:
                      raise SystemExit(f'Duplicate FAQ block: {faq_fingerprints[fingerprint]} and {filename}')
                  faq_fingerprints[fingerprint] = filename

          if missing_blog:
              raise SystemExit('Missing mini-blog: ' + ', '.join(missing_blog[:20]))
          if duplicate_blog:
              raise SystemExit('Duplicate mini-blog block: ' + ', '.join(duplicate_blog[:20]))
          if missing_faq:
              raise SystemExit('Missing FAQ: ' + ', '.join(missing_faq[:20]))
          if duplicate_faq:
              raise SystemExit('Duplicate FAQ block count: ' + ', '.join(duplicate_faq[:20]))
          if missing_schema:
              raise SystemExit('FAQ schema validation failed: ' + ', '.join(missing_schema[:20]))
          if bad_copy:
              raise SystemExit('Awkward generated city copy: ' + ', '.join(sorted(set(bad_copy))[:20]))

          print(f'Validated mini-blog and unique FAQ coverage on {len(local_pages)} local pages.')
          PY

      - name: Commit enriched pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' sitemap.xml
          if git diff --cached --quiet; then
            echo "All local pages already contain current unique SEO enrichment."
          else
            git commit -m "Enrich local SEO pages with accurate FAQs, project notes and sitemap dates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
