name: Generate Yelp service images

on:
  push:
    branches:
      - yelp-image-text-20261112
    paths:
      - .github/workflows/generate-yelp-service-images.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create labeled images
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          WIDTH, HEIGHT = 1600, 1200
          OUT = Path("output/yelp-service-images")
          OUT.mkdir(parents=True, exist_ok=True)

          BOLD = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          REGULAR = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          items = [
              {
                  "source": "assets/images/illustrations/cloud-approved-batch-v1/luna-illustrative-standing-seam-metal.webp",
                  "output": "01_Roofing_Dallas_Fort_Worth.jpg",
                  "title": "ROOFING IN DALLAS–FORT WORTH",
                  "url": "lunageneralcontractors.com/roofing.html",
              },
              {
                  "source": "assets/images/project-photos/kitchens/2020-cocina-gabinetes-claros-isla-f0089.jpg",
                  "output": "02_Kitchen_Remodeling.jpg",
                  "title": "KITCHEN REMODELING",
                  "url": "lunageneralcontractors.com/kitchens.html",
              },
              {
                  "source": "assets/images/project-photos/bathrooms/2018-bano-ducha-revestimiento-veteado-f0028.jpg",
                  "output": "03_Bathroom_Remodeling.jpg",
                  "title": "BATHROOM REMODELING",
                  "url": "lunageneralcontractors.com/bathrooms.html",
              },
              {
                  "source": "assets/images/illustrations/page-owned/flooring/flooring-scene-01.webp",
                  "output": "04_Flooring_Installation.jpg",
                  "title": "FLOORING INSTALLATION",
                  "url": "lunageneralcontractors.com/flooring.html",
              },
              {
                  "source": "assets/images/illustrations/interior-services-local-batch-v1/05-finished-painted-room.webp",
                  "output": "05_Interior_Exterior_Painting.jpg",
                  "title": "INTERIOR & EXTERIOR PAINTING",
                  "url": "lunageneralcontractors.com/painting.html",
              },
          ]

          def fitted_font(text: str, max_width: int, start_size: int, minimum: int = 28):
              size = start_size
              while size >= minimum:
                  font = ImageFont.truetype(BOLD, size)
                  box = font.getbbox(text)
                  if box[2] - box[0] <= max_width:
                      return font
                  size -= 2
              return ImageFont.truetype(BOLD, minimum)

          def shadow_text(draw, xy, text, font, fill, shadow=(0, 0, 0, 185), offset=3):
              x, y = xy
              draw.text((x + offset, y + offset), text, font=font, fill=shadow)
              draw.text((x, y), text, font=font, fill=fill)

          for item in items:
              source = Path(item["source"])
              if not source.exists():
                  raise FileNotFoundError(source)

              with Image.open(source) as original:
                  original = ImageOps.exif_transpose(original).convert("RGB")
                  canvas = ImageOps.fit(
                      original,
                      (WIDTH, HEIGHT),
                      method=Image.Resampling.LANCZOS,
                      centering=(0.5, 0.48),
                  ).convert("RGBA")

              overlay = Image.new("RGBA", (WIDTH, HEIGHT), (0, 0, 0, 0))
              od = ImageDraw.Draw(overlay)

              fade_start = 700
              for y in range(fade_start, HEIGHT):
                  progress = (y - fade_start) / (HEIGHT - fade_start)
                  alpha = int(35 + 205 * progress)
                  od.line((0, y, WIDTH, y), fill=(10, 17, 22, alpha))

              panel_top = 885
              od.rectangle((0, panel_top, WIDTH, HEIGHT), fill=(10, 17, 22, 226))
              od.rectangle((0, panel_top, WIDTH, panel_top + 10), fill=(230, 173, 40, 255))
              canvas = Image.alpha_composite(canvas, overlay)
              draw = ImageDraw.Draw(canvas)

              x = 72
              brand_font = ImageFont.truetype(BOLD, 34)
              title_font = fitted_font(item["title"], WIDTH - 144, 68, 38)
              url_font = ImageFont.truetype(REGULAR, 34)

              shadow_text(draw, (x, 922), "LUNA GENERAL CONTRACTORS", brand_font, (230, 173, 40, 255), offset=2)
              shadow_text(draw, (x, 976), item["title"], title_font, (255, 255, 255, 255), offset=3)
              shadow_text(draw, (x, 1082), item["url"], url_font, (255, 255, 255, 255), offset=2)

              output_path = OUT / item["output"]
              canvas.convert("RGB").save(output_path, "JPEG", quality=94, optimize=True, progressive=True)

          lines = [
              "Luna General Contractors — Yelp service images",
              "Each image contains one corresponding page URL:",
              "",
          ]
          for item in items:
              lines.append(f"{item['output']} — https://{item['url']}")
          (OUT / "URL_Mapping.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload finished images
        uses: actions/upload-artifact@v4
        with:
          name: luna-yelp-service-images
          path: output/yelp-service-images/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
