name: Generate Local SEO Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "seo_payload/**"
  pull_request:
    paths:
      - "seo_payload/**"
permissions:
  contents: write

concurrency:
  group: local-seo-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore verified SEO generator
        shell: bash
        run: |
          cat seo_payload/part*.b64 > /tmp/seo_generator.py.gz.b64
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          payload = Path("/tmp/seo_generator.py.gz.b64").read_text(encoding="utf-8").strip()
          raw = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(raw).hexdigest()
          expected = "d8e979a6f1f2eb4d2e36b99ff3195c7d4f95a7d6efa4dbe7ef0929b68ed6c424"
          if digest != expected:
              raise SystemExit(f"Generator checksum mismatch: {digest}")

          source = raw.decode("utf-8")
          old_title = 'title=f"General Contractor in {name}, TX | Luna General Contractors"'
          new_title = 'title=f"Construction & Remodeling Services in {name}, TX | Luna General Contractors"'
          if old_title not in source:
              raise SystemExit("City title patch target was not found")
          source = source.replace(old_title, new_title, 1)

          old_schema = '"@type":"GeneralContractor"'
          new_schema = '"@type":["LocalBusiness","GeneralContractor"]'
          if old_schema not in source:
              raise SystemExit("LocalBusiness schema patch target was not found")
          source = source.replace(old_schema, new_schema, 1)
          Path("seo_generator.py").write_text(source, encoding="utf-8")
          PY

      - name: Generate city, service and article pages
        run: python seo_generator.py

      - name: Enrich local pages and strengthen internal links
        run: |
          python - <<'PY'
          import hashlib
          import html as html_lib
          import re
          from pathlib import Path

          manifest = Path("seo-generated-manifest.txt")
          generated = [x.strip() for x in manifest.read_text(encoding="utf-8").splitlines() if x.strip().endswith(".html")]
          generated_set = set(generated)

          service_labels = {
              "roofing": "Roofing",
              "bathroom-remodeling": "Bathroom Remodeling",
              "kitchen-remodeling": "Kitchen Remodeling",
              "flooring": "Flooring",
              "painting": "Painting",
              "drywall": "Drywall",
              "siding": "Siding",
              "carpentry": "Carpentry",
              "fencing": "Fencing",
              "commercial-construction": "Commercial Construction",
              "water-damage-restoration": "Water Damage Restoration",
              "insurance-claims": "Insurance Claim Repairs",
              "general-contractor": "General Contracting",
          }

          service_notes = {
              "roofing": ("roof condition, flashing, ventilation, decking and drainage details", "storm exposure, roof penetrations and the condition of the existing roofing system"),
              "bathroom-remodeling": ("layout, plumbing locations, waterproofing, ventilation and finish transitions", "shower assemblies, fixture clearances and moisture-prone areas"),
              "kitchen-remodeling": ("cabinet layout, appliance locations, electrical needs, plumbing and countertop dimensions", "daily workflow, storage, lighting and connections to adjacent rooms"),
              "flooring": ("subfloor condition, transitions, moisture concerns and door clearances", "traffic, pets, cleaning needs and how the selected material performs in the room"),
              "painting": ("surface preparation, patching, caulking, priming and coating selection", "existing texture, stains, glossy surfaces and high-wear areas"),
              "drywall": ("damage extent, framing behind the surface, tape joints, texture and paint-ready finishing", "matching surrounding surfaces and correcting underlying moisture or movement first"),
              "siding": ("wall protection, trim details, penetrations, clearances and weather-resistant transitions", "loose materials, failed sealant and hidden moisture at vulnerable exterior joints"),
              "carpentry": ("measurements, fastening, existing framing, trim profiles and finish preparation", "door openings, baseboards, casing, built-ins and structural support where required"),
              "fencing": ("post condition, alignment, gate operation, drainage and property-side access", "wind exposure, soil movement and the condition of existing rails and pickets"),
              "commercial-construction": ("access, phasing, code-related requirements, trade coordination and business operations", "tenant improvements, office repairs and scheduling work around occupied spaces"),
              "water-damage-restoration": ("moisture extent, affected materials, drying status and reconstruction sequencing", "wall cavities, cabinets, flooring layers and finishes beyond the first visible stain"),
              "insurance-claims": ("photos, measurements, observed conditions and a clear repair scope", "documenting affected trades without assuming coverage or policy decisions"),
              "general-contractor": ("existing conditions, access, project sequencing, materials and coordination between trades", "how structural, mechanical and finish work interact before construction begins"),
          }

          intros = [
              "A useful estimate starts with the conditions that are actually present at the property.",
              "Good project planning begins before materials are ordered or demolition starts.",
              "Two projects with the same service name can require very different scopes once existing conditions are reviewed.",
              "Clear documentation and trade coordination can prevent small unknowns from becoming expensive changes later.",
          ]
          closers = [
              "That review creates a clearer scope, better sequencing and more realistic expectations for the owner.",
              "Addressing those details early helps reduce rework and gives each trade better information before its portion begins.",
              "The goal is a repair or remodel that performs well and connects cleanly with the surrounding property.",
              "Planning around the existing building usually produces a more dependable result than relying on a generic scope.",
          ]

          suffixes = sorted(service_labels, key=len, reverse=True)
          city_pages = {}
          service_pages = []
          for filename in generated:
              stem = filename[:-5]
              matched = None
              for suffix in suffixes:
                  token = "-" + suffix
                  if stem.endswith(token):
                      matched = suffix
                      city_slug = stem[:-len(token)]
                      service_pages.append((filename, city_slug, matched))
                      city_pages.setdefault(city_slug, []).append((filename, matched))
                      break

          def city_name(slug):
              return " ".join(part.capitalize() for part in slug.split("-"))

          anchor = '<section class="seo-section seo-faq">'
          enriched = 0
          linked = 0

          for filename, city_slug, service in service_pages:
              path = Path(filename)
              if not path.exists():
                  continue
              page = path.read_text(encoding="utf-8")
              city = city_name(city_slug)
              label = service_labels[service]
              note1, note2 = service_notes[service]
              digest = int(hashlib.sha256(filename.encode()).hexdigest()[:8], 16)

              if '<section class="seo-section seo-mini-blog">' not in page and anchor in page:
                  p1 = f"{intros[digest % len(intros)]} For {label.lower()} in {city}, we review {note1}. The purpose is to build the scope around the property rather than assume every home or commercial space is constructed the same way."
                  p2 = f"We also consider {note2}. {closers[(digest // 7) % len(closers)]}"
                  title_choices = [
                      f"Planning {label} Work in {city}",
                      f"What We Review Before {label} in {city}",
                      f"Existing Conditions Matter for {city} {label}",
                      f"A Better Starting Point for {label} in {city}",
                  ]
                  title = title_choices[(digest // 13) % len(title_choices)]
                  block = (
                      '<section class="seo-section seo-mini-blog"><div class="container"><article>'
                      '<p class="eyebrow gold">Local Project Notes</p>'
                      f'<h2>{html_lib.escape(title)}</h2><p>{html_lib.escape(p1)}</p><p>{html_lib.escape(p2)}</p>'
                      '</article></div></section>'
                  )
                  page = page.replace(anchor, block + anchor, 1)
                  enriched += 1

              if 'data-local-service-links' not in page and anchor in page:
                  siblings = [(f, s) for f, s in city_pages.get(city_slug, []) if f != filename]
                  siblings.sort(key=lambda x: x[1])
                  if siblings:
                      links = ''.join(
                          f'<a class="seo-service-link" href="{html_lib.escape(f)}"><strong>{html_lib.escape(service_labels[s])}</strong><span>Explore {html_lib.escape(service_labels[s].lower())} options in {html_lib.escape(city)}</span></a>'
                          for f, s in siblings[:6]
                      )
                      city_main = f"{city_slug}.html"
                      city_link = f'<p><a class="btn btn-outline" href="{city_main}">View all construction services in {html_lib.escape(city)}</a></p>' if city_main in generated_set else ''
                      block = (
                          '<section class="seo-section seo-muted" data-local-service-links><div class="container">'
                          f'<p class="eyebrow gold">More Local Services</p><h2>More Construction Services in {html_lib.escape(city)}</h2>'
                          f'<div class="seo-service-grid">{links}</div>{city_link}</div></section>'
                      )
                      page = page.replace(anchor, block + anchor, 1)
                      linked += 1

              path.write_text(page, encoding="utf-8")

          # Add direct links from each city landing page to every generated service page for that city.
          for city_slug, siblings in city_pages.items():
              city_file = f"{city_slug}.html"
              if city_file not in generated_set or not Path(city_file).exists():
                  continue
              path = Path(city_file)
              page = path.read_text(encoding="utf-8")
              if 'data-city-crawl-links' in page or anchor not in page:
                  continue
              city = city_name(city_slug)
              links = ''.join(
                  f'<a href="{html_lib.escape(f)}">{html_lib.escape(service_labels[s])}</a>'
                  for f, s in sorted(siblings, key=lambda x: x[1])
              )
              block = (
                  '<section class="seo-section" data-city-crawl-links><div class="container">'
                  f'<h2>Services We Provide in {html_lib.escape(city)}</h2><div class="seo-nearby">{links}</div>'
                  '</div></section>'
              )
              page = page.replace(anchor, block + anchor, 1)
              path.write_text(page, encoding="utf-8")

          print(f"Enriched {enriched} local service pages; strengthened links on {linked} pages.")
          PY

      - name: Integrate navigation and footer links
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path("index.html")
          text = home.read_text(encoding="utf-8")
          if 'href="service-areas.html"' not in text:
              marker = '<a href="#contact">Contact</a>'
              replacement = '<a href="service-areas.html">Service Areas</a>\n        <a href="articles.html">Resources</a>\n        ' + marker
              text = text.replace(marker, replacement, 1)
          home.write_text(text, encoding="utf-8")

          service_pages = [
              "roofing.html", "mitigation.html", "insurance-claims.html",
              "kitchens.html", "bathrooms.html", "flooring.html",
              "painting.html", "drywall.html", "siding.html",
              "carpentry.html", "fencing.html", "commercial.html"
          ]
          for filename in service_pages:
              path = Path(filename)
              if not path.exists():
                  continue
              page = path.read_text(encoding="utf-8")
              if 'href="service-areas.html"' not in page:
                  marker = '<a href="index.html#estimate-form">Contact</a>'
                  replacement = '<a href="service-areas.html">Service Areas</a><a href="articles.html">Resources</a>' + marker
                  page = page.replace(marker, replacement, 1)
              path.write_text(page, encoding="utf-8")
          PY

      - name: Update sitemap dates for meaningful page changes
        run: python scripts/update_sitemap_lastmod.py

      - name: Validate generated SEO output
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          generated = [line.strip() for line in Path("seo-generated-manifest.txt").read_text(encoding="utf-8").splitlines() if line.strip().endswith(".html")]
          if len(generated) != 517:
              raise SystemExit(f"Expected 517 generated HTML pages, found {len(generated)}")

          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          url_count = sitemap.count("<url>")
          if url_count != 530:
              raise SystemExit(f"Expected 530 sitemap URLs, found {url_count}")

          index_pages = {"service-areas.html", "services-by-city.html", "articles.html"}
          base_tokens = ["<title>", 'name="description"', "<h1", 'rel="canonical"', 'property="og:title"', 'application/ld+json']
          titles = []
          enriched_service_pages = 0
          for filename in generated:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Missing generated page: {filename}")
              page = path.read_text(encoding="utf-8")
              for token in base_tokens:
                  if token not in page:
                      raise SystemExit(f"{filename} is missing {token}")
              if filename not in index_pages and "BreadcrumbList" not in page:
                  raise SystemExit(f"{filename} is missing BreadcrumbList")
              if "noindex" in page.lower():
                  raise SystemExit(f"Unexpected noindex in {filename}")
              match = re.search(r"<title>(.*?)</title>", page, re.S)
              if not match:
                  raise SystemExit(f"Missing title in {filename}")
              titles.append(match.group(1).strip())
              if 'data-local-service-links' in page:
                  enriched_service_pages += 1
                  if 'seo-mini-blog' not in page:
                      raise SystemExit(f"{filename} has local links but no local content block")

          if len(titles) != len(set(titles)):
              raise SystemExit("Generated page titles are not unique")
          if enriched_service_pages < 400:
              raise SystemExit(f"Expected at least 400 enriched city-service pages, found {enriched_service_pages}")

          for filename in ["service-areas.html", "services-by-city.html", "articles.html"]:
              if not Path(filename).exists():
                  raise SystemExit(f"Required index page was not generated: {filename}")

          print(f"Validated {len(generated)} HTML pages, {enriched_service_pages} enriched city-service pages and {url_count} sitemap URLs.")
          PY

      - name: Remove temporary generator
        run: rm -f seo_generator.py

      - name: Apply sitemap exclusion index controls
        run: |
          python scripts/apply_sitemap_exclusion_noindex.py
          python scripts/validate_sitemap_exclusions.py
          python scripts/seo_quality_audit.py --root . --report seo-audit-report.md --strict

      - name: Commit generated website files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Generate enriched local SEO pages and crawl links"
            git push origin HEAD:main
          fi