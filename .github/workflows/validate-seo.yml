name: Validate SEO

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/validate_seo.py"
      - ".github/workflows/validate-seo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generated SEO pages
        run: python scripts/validate_seo.py
