name: Luna Engine Preview

on:
  workflow_dispatch:
  push:
    paths:
      - "luna_engine/**"
      - ".github/workflows/luna-engine-preview.yml"

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build city and city-service previews
        run: python luna_engine/build.py

      - name: Validate Luna Engine output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dist = Path("luna_engine/dist")
          pages = sorted(dist.glob("*.html"))
          manifest_path = dist / "manifest.json"
          if not manifest_path.exists():
              raise SystemExit("Missing Luna Engine manifest")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if len(manifest.get("pages", [])) != len(pages):
              raise SystemExit("Manifest page count does not match generated HTML")
          if len(pages) < 4:
              raise SystemExit(f"Expected at least four generated pages, found {len(pages)}")

          common = [
              "<title>", 'name="description"', 'rel="canonical"', "<h1>",
              "LocalBusiness", "GeneralContractor", "BreadcrumbList", "FAQPage",
              "tel:+18177845998", 'name="robots"', 'property="og:title"'
          ]
          for page in pages:
              html = page.read_text(encoding="utf-8")
              missing = [token for token in common if token not in html]
              if missing:
                  raise SystemExit(f"{page}: missing {', '.join(missing)}")
              if page.stem.count("-") >= 1 and page.stem != "midlothian":
                  if '"@type":"Service"' not in html:
                      raise SystemExit(f"{page}: missing Service schema")
          print(f"Validated {len(pages)} Luna Engine page(s).")
          PY

      - name: Commit preview output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luna_engine/dist
          if git diff --cached --quiet; then
            echo "No preview changes to commit."
          else
            git commit -m "Build Luna Engine city and service previews [skip ci]"
            git push origin HEAD:main
          fi
