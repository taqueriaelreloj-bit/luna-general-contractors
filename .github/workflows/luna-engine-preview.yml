name: Luna Engine Preview

on:
  workflow_dispatch:
  push:
    paths:
      - "luna_engine/**"
      - ".github/workflows/luna-engine-preview.yml"

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data-driven city preview
        run: python luna_engine/build.py

      - name: Validate preview output
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = sorted(Path("luna_engine/dist").glob("*.html"))
          if not pages:
              raise SystemExit("Luna Engine generated no HTML pages")

          required = [
              "<title>",
              'name="description"',
              'rel="canonical"',
              "<h1>",
              "LocalBusiness",
              "GeneralContractor",
              "BreadcrumbList",
              "FAQPage",
              "tel:+18177845998",
          ]
          for page in pages:
              html = page.read_text(encoding="utf-8")
              missing = [token for token in required if token not in html]
              if missing:
                  raise SystemExit(f"{page}: missing {', '.join(missing)}")
          print(f"Validated {len(pages)} Luna Engine preview page(s).")
          PY

      - name: Commit preview output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luna_engine/dist
          if git diff --cached --quiet; then
            echo "No preview changes to commit."
          else
            git commit -m "Build Luna Engine preview pages [skip ci]"
            git push origin HEAD:main
          fi
