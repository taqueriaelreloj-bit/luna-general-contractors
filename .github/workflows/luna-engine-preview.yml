name: Luna Engine Preview

on:
  workflow_dispatch:
  push:
    paths:
      - "luna_engine/**"
      - ".github/workflows/luna-engine-preview.yml"

permissions:
  contents: write

concurrency:
  group: luna-engine-preview
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize remaining DFW city data
        run: python luna_engine/materialize_dfw_cities.py

      - name: Build city and city-service previews
        run: python luna_engine/build.py

      - name: Ensure unique service-page titles
        run: python luna_engine/ensure_unique_titles.py

      - name: Validate Luna Engine output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("luna_engine")
          dist = root / "dist"
          city_files = sorted((root / "content" / "cities").glob("*.json"))
          service_files = sorted((root / "content" / "services").glob("*.json"))
          pages = sorted(dist.glob("*.html"))
          manifest_path = dist / "manifest.json"

          if not manifest_path.exists():
              raise SystemExit("Missing Luna Engine manifest")
          if len(city_files) != 36:
              raise SystemExit(f"Expected 36 city data files, found {len(city_files)}")
          if len(service_files) != 13:
              raise SystemExit(f"Expected 13 service data files, found {len(service_files)}")

          expected_pages = len(city_files) * (len(service_files) + 1)
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest_pages = manifest.get("pages", [])

          if manifest.get("cities") != len(city_files):
              raise SystemExit("Manifest city count is incorrect")
          if manifest.get("services") != len(service_files):
              raise SystemExit("Manifest service count is incorrect")
          if len(pages) != expected_pages:
              raise SystemExit(f"Expected {expected_pages} generated pages, found {len(pages)}")
          if len(manifest_pages) != len(pages):
              raise SystemExit("Manifest page count does not match generated HTML")
          if set(manifest_pages) != {page.name for page in pages}:
              raise SystemExit("Manifest file list does not match generated HTML")

          required = [
              "<title>", 'name="description"', 'rel="canonical"', "<h1>",
              "LocalBusiness", "GeneralContractor", '"@type":"Service"',
              "Organization", "WebPage", "BreadcrumbList", "FAQPage",
              "tel:+18177845998", 'name="robots"', 'property="og:title"',
              'property="og:description"', 'property="og:url"',
          ]

          titles = set()
          canonicals = set()
          for page in pages:
              html = page.read_text(encoding="utf-8")
              missing = [token for token in required if token not in html]
              if missing:
                  raise SystemExit(f"{page}: missing {', '.join(missing)}")
              if html.count("<h1>") != 1:
                  raise SystemExit(f"{page}: expected exactly one H1")
              if "noindex" in html.lower():
                  raise SystemExit(f"{page}: unexpected noindex")

              title = html.split("<title>", 1)[1].split("</title>", 1)[0]
              canonical = html.split('rel="canonical" href="', 1)[1].split('"', 1)[0]
              if title in titles:
                  raise SystemExit(f"Duplicate title: {title}")
              if canonical in canonicals:
                  raise SystemExit(f"Duplicate canonical: {canonical}")
              titles.add(title)
              canonicals.add(canonical)

          print(f"Validated {len(pages)} Luna Engine pages from {len(city_files)} cities and {len(service_files)} services.")
          PY

      - name: Publish pages to site root and update sitemap
        run: python luna_engine/publish.py

      - name: Generate second local SEO article batch
        run: python luna_engine/build_articles.py

      - name: Generate third local SEO article batch
        run: python luna_engine/build_articles_batch3.py

      - name: Validate published pages and articles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          manifest = json.loads((root / 'luna_engine/dist/manifest.json').read_text(encoding='utf-8'))
          pages = manifest['pages']
          missing = [name for name in pages if not (root / name).exists()]
          if missing:
              raise SystemExit(f"Missing {len(missing)} published pages; first: {missing[0]}")

          for name in pages:
              html = (root / name).read_text(encoding='utf-8')
              if 'href="../../' in html:
                  raise SystemExit(f"Preview-only relative link remains in {name}")
              if 'href="/styles.css"' not in html:
                  raise SystemExit(f"Root stylesheet link missing in {name}")

          article_manifest = root / 'luna_engine/article-manifest.txt'
          article_pages = [line.strip() for line in article_manifest.read_text(encoding='utf-8').splitlines() if line.strip()]
          if len(article_pages) != 25:
              raise SystemExit(f"Expected 25 generated articles, found {len(article_pages)}")
          article_index = (root / 'articles.html').read_text(encoding='utf-8')
          for name in article_pages:
              path = root / name
              if not path.exists():
                  raise SystemExit(f"Missing generated article: {name}")
              html = path.read_text(encoding='utf-8')
              for token in ('<title>', '<h1>', 'Article', 'BreadcrumbList', 'FAQPage', 'rel="canonical"'):
                  if token not in html:
                      raise SystemExit(f"{name}: missing {token}")
              if f'href="{name}"' not in article_index:
                  raise SystemExit(f"Article index missing {name}")

          tree = ET.parse(root / 'sitemap.xml')
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          sitemap_urls = {node.text for node in tree.findall('sm:url/sm:loc', ns) if node.text}
          all_names = pages + article_pages
          missing_urls = [f"https://lunageneralcontractors.com/{name}" for name in all_names if f"https://lunageneralcontractors.com/{name}" not in sitemap_urls]
          if missing_urls:
              raise SystemExit(f"Sitemap missing {len(missing_urls)} generated URLs; first: {missing_urls[0]}")
          print(f"Validated {len(pages)} local pages, {len(article_pages)} articles and sitemap coverage.")
          PY

      - name: Audit technical SEO sitemap robots and internal links
        run: python luna_engine/validate_published_site.py

      - name: Commit generated pages articles and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luna_engine/content/cities luna_engine/dist luna_engine/article-manifest.txt sitemap.xml articles.html
          python - <<'PY' > /tmp/luna-pages.txt
          import json
          from pathlib import Path
          manifest = json.loads(Path('luna_engine/dist/manifest.json').read_text(encoding='utf-8'))
          article_pages = [line.strip() for line in Path('luna_engine/article-manifest.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          print('\n'.join(manifest['pages'] + article_pages))
          PY
          git add --pathspec-from-file=/tmp/luna-pages.txt
          if git diff --cached --quiet; then
            echo "No Luna Engine changes to commit."
          else
            git commit -m "Publish DFW local pages and 25 SEO articles [skip ci]"
            for attempt in 1 2 3 4; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Published successfully on attempt ${attempt}."
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Remote changed during publish; retrying (${attempt}/4)..."
              sleep $((attempt * 3))
            done
            echo "Unable to publish after 4 attempts."
            exit 1
          fi
