name: Luna Engine Preview

on:
  workflow_dispatch:
  push:
    paths:
      - "luna_engine/**"
      - ".github/workflows/luna-engine-preview.yml"

permissions:
  contents: write

concurrency:
  group: luna-engine-preview
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize remaining DFW city data
        run: python luna_engine/materialize_dfw_cities.py

      - name: Build city and city-service previews
        run: python luna_engine/build.py

      - name: Validate Luna Engine output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dist = Path("luna_engine/dist")
          pages = sorted(dist.glob("*.html"))
          manifest_path = dist / "manifest.json"
          if not manifest_path.exists():
              raise SystemExit("Missing Luna Engine manifest")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest_pages = manifest.get("pages", [])
          if len(manifest_pages) != len(pages):
              raise SystemExit("Manifest page count does not match generated HTML")
          if set(manifest_pages) != {page.name for page in pages}:
              raise SystemExit("Manifest file list does not match generated HTML")
          if len(pages) != 504:
              raise SystemExit(f"Expected 504 generated pages for 36 cities and 13 services, found {len(pages)}")

          required = [
              "<title>",
              'name="description"',
              'rel="canonical"',
              "<h1>",
              "LocalBusiness",
              "GeneralContractor",
              '"@type":"Service"',
              "Organization",
              "WebPage",
              "BreadcrumbList",
              "FAQPage",
              "tel:+18177845998",
              'name="robots"',
              'property="og:title"',
              'property="og:description"',
              'property="og:url"',
          ]

          titles = set()
          for page in pages:
              html = page.read_text(encoding="utf-8")
              missing = [token for token in required if token not in html]
              if missing:
                  raise SystemExit(f"{page}: missing {', '.join(missing)}")
              if html.count("<h1>") != 1:
                  raise SystemExit(f"{page}: expected exactly one H1")
              if "noindex" in html.lower():
                  raise SystemExit(f"{page}: unexpected noindex")
              title = html.split("<title>", 1)[1].split("</title>", 1)[0]
              if title in titles:
                  raise SystemExit(f"Duplicate title: {title}")
              titles.add(title)

          print(f"Validated {len(pages)} Luna Engine pages across 36 cities.")
          PY

      - name: Commit preview output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luna_engine/dist
          if git diff --cached --quiet; then
            echo "No preview changes to commit."
          else
            git commit -m "Build all 36 DFW city and service previews [skip ci]"
            git push origin HEAD:main
          fi
