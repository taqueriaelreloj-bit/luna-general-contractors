name: Enrich City SEO Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/enrich_city_pages.py"
      - ".github/workflows/enrich-city-pages.yml"

permissions:
  contents: write

concurrency:
  group: city-page-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add unique local content to all city pages
        run: python scripts/enrich_city_pages.py

      - name: Verify all city pages were enriched
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("seo-generated-manifest.txt").read_text(encoding="utf-8").splitlines()
          city_pages = []
          for name in manifest:
              name = name.strip()
              if not name.endswith(".html"):
                  continue
              stem = name[:-5]
              if stem in {"articles", "service-areas", "services-by-city"}:
                  continue
              if any(stem.endswith("-" + service) for service in [
                  "roofing", "bathroom-remodeling", "kitchen-remodeling", "flooring",
                  "painting", "drywall", "siding", "carpentry", "fencing",
                  "commercial-construction", "water-damage-restoration",
                  "insurance-claims", "general-contractor"
              ]):
                  continue
              if name.count("-") > 4:
                  continue
              path = Path(name)
              if path.exists() and 'data-city-depth="1"' in path.read_text(encoding="utf-8"):
                  city_pages.append(name)

          if len(city_pages) != 36:
              raise SystemExit(f"Expected 36 enriched city pages, found {len(city_pages)}")
          print("Verified 36 enriched city pages.")
          PY

      - name: Commit enriched city pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "City pages already contain the enrichment."
          else
            git commit -m "Enrich all city SEO pages with unique local content"
            git push origin HEAD:main
          fi
