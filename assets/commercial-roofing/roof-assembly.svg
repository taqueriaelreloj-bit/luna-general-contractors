<svg xmlns="http://www.w3.org/2000/svg" width="850" height="440" viewBox="0 0 850 440" role="img" aria-labelledby="title desc"><title id="title">A low-slope roof is a layered assembly</title><desc id="desc">Concept diagram showing a membrane, an optional cover board, insulation and a structural deck. Actual assemblies, attachment and air or vapor control layers vary by project.</desc><rect width="850" height="440" rx="16" fill="#17313e"/><text x="38" y="37" fill="#eec24d" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">UNDER THE SURFACE</text><g><path d="M70 290L285 350 476 278 260 218Z" fill="#657985" stroke="#ffffff" stroke-opacity=".45"/><path d="M70 290L285 350 476 278V295L285 367 70 307Z" fill="#3c5361"/><path d="M476 278H520" stroke="#d6e3e8" stroke-width="1.5"/><circle cx="536" cy="278" r="12" fill="#f1bd39"/><text x="536" y="282" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#15232d">4</text><text x="558" y="283" font-family="Arial,sans-serif" font-size="16" fill="#eef4f5">Structural deck</text></g><g><path d="M70 236L285 296 476 224 260 164Z" fill="#dcb65c" stroke="#ffffff" stroke-opacity=".45"/><path d="M70 236L285 296 476 224V241L285 313 70 253Z" fill="#aa8234"/><path d="M476 224H520" stroke="#d6e3e8" stroke-width="1.5"/><circle cx="536" cy="224" r="12" fill="#f1bd39"/><text x="536" y="228" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#15232d">3</text><text x="558" y="229" font-family="Arial,sans-serif" font-size="16" fill="#eef4f5">Insulation</text></g><g><path d="M70 186L285 246 476 174 260 114Z" fill="#b8bdb4" stroke="#ffffff" stroke-opacity=".45"/><path d="M70 186L285 246 476 174V191L285 263 70 203Z" fill="#7d8b83"/><path d="M476 174H520" stroke="#d6e3e8" stroke-width="1.5"/><circle cx="536" cy="174" r="12" fill="#f1bd39"/><text x="536" y="178" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#15232d">2</text><text x="558" y="179" font-family="Arial,sans-serif" font-size="16" fill="#eef4f5">Cover board, if specified</text></g><g><path d="M70 137L285 197 476 125 260 65Z" fill="#f5f7f5" stroke="#ffffff" stroke-opacity=".45"/><path d="M70 137L285 197 476 125V142L285 214 70 154Z" fill="#c5d4d9"/><path d="M476 125H520" stroke="#d6e3e8" stroke-width="1.5"/><circle cx="536" cy="125" r="12" fill="#f1bd39"/><text x="536" y="129" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#15232d">1</text><text x="558" y="130" font-family="Arial,sans-serif" font-size="16" fill="#eef4f5">Roof membrane</text></g><text x="38" y="410" fill="#b9cbd3" font-family="Arial,sans-serif" font-size="13">Concept only · Layer order, attachment and additional components depend on the specified assembly.</text></svg>